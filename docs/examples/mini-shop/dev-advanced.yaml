version: "2"

containers:
  redis:
    image: redis:7.4-alpine
    ports:
      redis: "26379:6379"
    health_check:
      type: tcp
      port: 26379

services:
  catalog-api:
    type: python
    kind: backend
    path: ./apps/catalog-api
    command: python3 main.py
    ports:
      http: 3001
    depends_on: [redis]
    health_check:
      type: http
      path: /health
      port: 3001
    env:
      DATABASE_PATH: mini_shop_catalog.db
      DATA_DIR: .

  order-api:
    type: python
    kind: backend
    path: ./apps/order-api
    command: python3 main.py
    ports:
      http: 3002
    depends_on: [catalog-api, inventory-api, redis]
    health_check:
      type: http
      path: /health
      port: 3002
    env:
      CATALOG_API_URL: http://127.0.0.1:3001
      INVENTORY_API_URL: http://127.0.0.1:3003
      CUSTOMER_API_URL: http://127.0.0.1:3004
      DATABASE_PATH: mini_shop_orders.db
      DATA_DIR: .
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "26379"

  customer-api:
    type: python
    kind: backend
    path: ./apps/customer-api
    command: python3 main.py
    ports:
      http: 3004
    depends_on: [redis]
    health_check:
      type: http
      path: /health
      port: 3004
    env:
      DATABASE_PATH: mini_shop_customers.db
      DATA_DIR: .

  inventory-api:
    type: python
    kind: backend
    path: ./apps/inventory-api
    command: python3 main.py
    ports:
      http: 3003
    depends_on: [redis]
    health_check:
      type: http
      path: /health
      port: 3003
    env:
      DATABASE_PATH: mini_shop_inventory.db
      DATA_DIR: .
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "26379"

  cart-api:
    type: python
    kind: backend
    path: ./apps/cart-api
    command: python3 main.py
    ports:
      http: 3005
    depends_on: [catalog-api]
    health_check:
      type: http
      path: /health
      port: 3005
    env:
      DATABASE_PATH: mini_shop_cart.db
      DATA_DIR: .
      CATALOG_API_URL: http://127.0.0.1:3001

  payment-api:
    type: python
    kind: backend
    path: ./apps/payment-api
    command: python3 main.py
    ports:
      http: 3007
    health_check:
      type: http
      path: /health
      port: 3007
    env: {}

  shipping-api:
    type: python
    kind: backend
    path: ./apps/shipping-api
    command: python3 main.py
    ports:
      http: 3008
    depends_on: [order-api]
    health_check:
      type: http
      path: /health
      port: 3008
    env:
      DATABASE_PATH: mini_shop_shipping.db
      DATA_DIR: .

  checkout-api:
    type: python
    kind: backend
    path: ./apps/checkout-api
    command: python3 main.py
    ports:
      http: 3006
    depends_on: [order-api, inventory-api, catalog-api, customer-api, cart-api, payment-api, shipping-api]
    health_check:
      type: http
      path: /health
      port: 3006
    env:
      NOTIFICATION_API_URL: http://127.0.0.1:3009
  observability-api:
    type: python
    kind: backend
    path: ./apps/observability-api
    command: python3 main.py
    ports:
      http: 3010
    depends_on: [order-api, shipping-api]
    health_check:
      type: http
      path: /health
      port: 3010
    env:
      ORDER_API_URL: http://127.0.0.1:3002
      SHIPPING_API_URL: http://127.0.0.1:3008
      REFRESH_INTERVAL_SECONDS: "1.5"


  web:
    type: python
    kind: frontend
    path: ./apps/web
    command: python3 main.py
    ports:
      http: 3000
    depends_on: [checkout-api]
    health_check:
      type: http
      path: /
      port: 3000
    env:
      PORT: "3000"
      CATALOG_API_URL: http://127.0.0.1:3001
      ORDER_API_URL: http://127.0.0.1:3002
      INVENTORY_API_URL: http://127.0.0.1:3003
      CUSTOMER_API_URL: http://127.0.0.1:3004
      CART_API_URL: http://127.0.0.1:3005
      CHECKOUT_API_URL: http://127.0.0.1:3006
      PAYMENT_API_URL: http://127.0.0.1:3007
      SHIPPING_API_URL: http://127.0.0.1:3008
      OBSERVABILITY_API_URL: http://127.0.0.1:3010
      NOTIFICATION_API_URL: http://127.0.0.1:3009

  notification-api:
    type: python
    kind: backend
    path: ./apps/notification-api
    command: python3 main.py
    ports:
      http: 3009
    depends_on: [checkout-api]
    health_check:
      type: http
      path: /health
      port: 3009
    env:
      DATABASE_PATH: mini_shop_notifications.db
      DATA_DIR: .



groups:
  mini-shop:
    enabled: true
    services: [catalog-api, inventory-api, customer-api, order-api, cart-api, payment-api, shipping-api, checkout-api, web]
  mini-shop-advanced:
    enabled: true
    services: [catalog-api, inventory-api, customer-api, order-api, cart-api, payment-api, shipping-api, checkout-api, observability-api, notification-api, web]
