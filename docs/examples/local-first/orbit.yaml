version: "3"

containers:
  redis:
    image: redis:7.4-alpine
    ports:
      redis:
        preferred: 26379
        target: 6379
    health_check:
      type: tcp

services:
  app:
    kind: frontend
    command: python3 -m http.server "$PORT"
    ports:
      http:
        preferred: 28080
    depends_on: [redis]
    health_check:
      type: http
      path: /
