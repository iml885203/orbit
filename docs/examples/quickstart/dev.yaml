# Quickstart env — a complete, runnable orbit environment with no repo
# checkouts and no team-specific assumptions. Try it straight from a clone:
#
#   orbit -c docs/examples/quickstart/dev.yaml up
#   orbit -c docs/examples/quickstart/dev.yaml status
#   orbit open
#   orbit -c docs/examples/quickstart/dev.yaml down
#
# Preferred host ports use a 2xxxx prefix. ORBIT_AUTO_PORT_* lets Orbit move
# only these demo ports when one is already occupied; normal project ports
# remain fixed. Each container demonstrates a different health_check type.

version: "2"

containers:
  redis:
    image: redis:7.4
    ports:
      redis: "${ORBIT_AUTO_PORT_QUICKSTART_REDIS:-26379}:6379"
    health_check:
      type: tcp
      port: ${ORBIT_AUTO_PORT_QUICKSTART_REDIS:-26379}

  postgres:
    image: postgres:16
    ports:
      postgres: "${ORBIT_AUTO_PORT_QUICKSTART_POSTGRES:-25432}:5432"
    environment:
      POSTGRES_PASSWORD: quickstart
    health_check:
      type: log
      pattern: "database system is ready to accept connections"

  web:
    image: nginx:alpine
    kind: frontend
    ports:
      http: "${ORBIT_AUTO_PORT_QUICKSTART_WEB:-28080}:80"
    depends_on: [redis, postgres]
    health_check:
      type: http
      path: /
      port: ${ORBIT_AUTO_PORT_QUICKSTART_WEB:-28080}

# Next step: add your own services (using any locally installed runtime) alongside the
# containers — see the minimal example in docs/team-adoption.md. Services
# get dependency connection info injected automatically based on the
# container images they depend on.
