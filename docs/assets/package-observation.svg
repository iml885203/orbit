<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 730" role="img" aria-labelledby="title desc">
  <title id="title">Package updater observation checkpoints</title>
  <desc id="desc">Persist dispatch intent before sending. Select a run without trusting it, verify identity, then observe its outcome. Channel verification stays separate. Unknown dispatch requires manual reconciliation.</desc>
  <style>text{font:16px system-ui,sans-serif;fill:#17314d;text-anchor:middle}.box{fill:#edf5ff;stroke:#49739e;stroke-width:1.5}.arrow{fill:none;stroke:#49739e;stroke-width:2}.small{font-size:14px}.separate{fill:#f5f3ed;stroke:#8a7752;stroke-width:1.5}</style>
  <defs><marker id="tip" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="#49739e"/></marker></defs>
  <rect width="360" height="730" rx="16" fill="#fff"/>
  <rect class="box" x="24" y="20" width="312" height="70" rx="8"/><text x="180" y="49">1. Save intent → dispatch</text><text class="small" x="180" y="73">Persist before sending</text>
  <rect class="box" x="24" y="130" width="312" height="78" rx="8"/><text x="180" y="160">2. Save selected run</text><text class="small" x="180" y="186">Not verified yet</text>
  <rect class="box" x="24" y="248" width="312" height="78" rx="8"/><text x="180" y="278">3. Verify exact identity</text><text class="small" x="180" y="304">Then observe updater outcome</text>
  <g class="arrow" marker-end="url(#tip)"><path d="M180 90V126"/><path d="M180 208V244"/></g>
  <rect class="separate" x="24" y="368" width="312" height="120" rx="8"/><text x="180" y="398">Separate channel gate</text><text class="small" x="180" y="424">Current formula / manifest</text><text class="small" x="180" y="450">Observer success alone does not</text><text class="small" x="180" y="474">prove package promotion passed.</text>
  <path class="arrow" d="M180 326V364" marker-end="url(#tip)"/>
  <rect class="box" x="24" y="550" width="312" height="154" rx="8"/><text x="180" y="580">Unknown dispatch?</text><text class="small" x="180" y="608">Inspect and reconcile manually.</text><text class="small" x="180" y="636">Never redispatch.</text><text class="small" x="180" y="678">Not an automatic success path.</text>
  <path class="arrow" stroke-dasharray="5 4" d="M336 55H348V626H340" marker-end="url(#tip)"/>
</svg>
