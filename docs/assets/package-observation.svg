<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
  <title id="title">Package updater observation checkpoints</title>
  <desc id="desc">Persist dispatch intent before sending. Select a run without trusting it, verify identity, then observe its outcome. Channel verification stays separate. Unknown dispatch requires manual reconciliation.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#17314d;font-size:16px}.box{fill:#edf5ff;stroke:#49739e;stroke-width:1.5}.arrow{fill:none;stroke:#49739e;stroke-width:2}.small{font-size:14px}.separate{fill:#f5f3ed;stroke:#8a7752;stroke-width:1.5}</style>
  <defs><marker id="tip" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="#49739e"/></marker></defs>
  <rect x="16" y="16" width="608" height="318" rx="16" fill="#fff"/>
  <rect class="box" x="40" y="40" width="260" height="56" rx="8"/><text x="60" y="74">1. Save intent → dispatch</text>
  <path class="arrow" d="M170 96V122" marker-end="url(#tip)"/>
  <rect class="box" x="40" y="128" width="260" height="56" rx="8"/><text x="60" y="153">2. Save selected run</text><text class="small" x="60" y="173">Not verified yet</text>
  <path class="arrow" d="M300 156H334" marker-end="url(#tip)"/>
  <rect class="box" x="342" y="128" width="250" height="56" rx="8"/><text x="360" y="153">3. Verify exact identity</text><text class="small" x="360" y="173">Observe → updater outcome</text>
  <path class="arrow" d="M300 68H342" marker-end="url(#tip)"/>
  <text class="small" x="354" y="63">Unknown dispatch?</text><text class="small" x="354" y="84">Inspect; never redispatch</text>
  <path class="arrow" d="M467 184V216" marker-end="url(#tip)"/>
  <rect class="separate" x="40" y="224" width="552" height="76" rx="8"/><text x="60" y="255">Separate channel gate: current formula / manifest</text><text class="small" x="60" y="280">Observer success alone never means package promotion passed.</text>
</svg>
