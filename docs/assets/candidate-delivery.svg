<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550" role="img" aria-labelledby="title desc"><title id="title">Verify one candidate, then promote it</title><desc id="desc">Approve current main, build one dashboard and six executables, run native and live SQL checks in parallel, then promote the unchanged inventory to an immutable release and package channels.</desc><style>text{font:16px system-ui,sans-serif;fill:#17314b}.box{fill:#edf5ff;stroke:#5484ad;stroke-width:1.5}.arrow{fill:none;stroke:#5484ad;stroke-width:2}@media(prefers-color-scheme:dark){text{fill:#e8f1fc}.box{fill:#182c42;stroke:#8cbbe8}.arrow{stroke:#8cbbe8}}</style><rect class="box" x="20" y="10" width="320" height="60" rx="12"/><text x="180" y="37" text-anchor="middle">Approve current main</text><text x="180" y="58" text-anchor="middle">Exact source + intended version</text><path class="arrow" d="M180 70v28m-5-5 5 5 5-5"/><rect class="box" x="20" y="100" width="320" height="80" rx="12"/><text x="180" y="127" text-anchor="middle">Build one candidate</text><text x="180" y="149" text-anchor="middle">1 dashboard · 6 executables</text><text x="180" y="170" text-anchor="middle">Manifest + SBOM + checksums</text><path class="arrow" d="M180 180v15H95v23m-5-5 5 5 5-5M180 195h85v23m-5-5 5 5 5-5"/><rect class="box" x="20" y="220" width="150" height="80" rx="12"/><text x="95" y="247" text-anchor="middle">6 native targets</text><text x="95" y="271" text-anchor="middle">OS + journeys</text><text x="95" y="292" text-anchor="middle">Bound receipts</text><rect class="box" x="190" y="220" width="150" height="80" rx="12"/><text x="265" y="247" text-anchor="middle">Live SQL Server</text><text x="265" y="271" text-anchor="middle">Same candidate</text><text x="265" y="292" text-anchor="middle">Bound receipt</text><path class="arrow" d="M95 300v20h85v28m-5-5 5 5 5-5M265 300v20h-85"/><rect class="box" x="20" y="350" width="320" height="70" rx="12"/><text x="180" y="379" text-anchor="middle">Promote tested bytes</text><text x="180" y="405" text-anchor="middle">Verify inventory · No rebuild</text><path class="arrow" d="M180 420v28m-5-5 5 5 5-5"/><rect class="box" x="20" y="450" width="320" height="85" rx="12"/><text x="180" y="477" text-anchor="middle">Immutable release</text><text x="180" y="501" text-anchor="middle">Verify assets + commit</text><text x="180" y="524" text-anchor="middle">Then Homebrew + Scoop</text></svg>