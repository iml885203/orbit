<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="native-title native-desc"><title id="native-title">原生 CI 與發布驗證邊界</title><desc id="native-desc">一般 CI 依變更選擇 profile；發布仍需完整原生與 SQL 證據。</desc><style>text{font:14px system-ui,sans-serif;fill:#17314b}rect{fill:#eef6ff;stroke:#5a7da6}path{stroke:#5a7da6;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#edf5ff}rect{fill:#18314b;stroke:#91b3d6}path{stroke:#91b3d6}}</style><text x="18" y="24">一般 PR／main</text><rect x="18" y="38" width="324" height="44" rx="8"/><text x="180" y="65" text-anchor="middle">判定變更影響</text><path d="M35 82v164m0-116h19m-5-5 5 5-5 5m-14 53h19m-5-5 5 5-5 5m-14 53h19m-5-5 5 5-5 5"/><rect x="58" y="108" width="284" height="44" rx="8"/><text x="200" y="135" text-anchor="middle">已知文件：原生驗證 no-op</text><rect x="58" y="166" width="284" height="44" rx="8"/><text x="200" y="193" text-anchor="middle">一般功能／UI：Linux 兩架構</text><rect x="58" y="224" width="284" height="44" rx="8"/><text x="200" y="251" text-anchor="middle">主機／政策／未知：完整六平台</text><text x="18" y="326">發布</text><rect x="18" y="342" width="324" height="50" rx="8"/><text x="180" y="373" text-anchor="middle">固定六平台原生驗證與 SQL 證據</text></svg>
