<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">Dashboard graph ownership</title><desc id="desc">Daemon status is authoritative. GraphStore admits matching reads and scoped mutations, keeps preview separate and retains read-only snapshots during reconnect or switching.</desc><style>text{font:15px system-ui,sans-serif;fill:#172554}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.sub{font-size:13px}.line{fill:none;stroke:#2563eb;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs><rect class="box" x="20" y="30" width="200" height="85" rx="10"/><text x="120" y="60" text-anchor="middle">DaemonStore</text><text class="sub" x="120" y="85" text-anchor="middle">SSE context + resources</text><rect class="box" x="260" y="30" width="205" height="115" rx="10"/><text x="362" y="58" text-anchor="middle">GraphStore</text><text class="sub" x="362" y="82" text-anchor="middle">One publication boundary</text><text class="sub" x="362" y="103" text-anchor="middle">Reads + edge intents</text><text class="sub" x="362" y="124" text-anchor="middle">Preview + switch intent</text><rect class="box" x="505" y="30" width="195" height="85" rx="10"/><text x="602" y="60" text-anchor="middle">Canvas + drawer</text><text class="sub" x="602" y="85" text-anchor="middle">Matching live graph</text><path class="line" marker-end="url(#arrow)" d="M220 72H253"/><path class="line" marker-end="url(#arrow)" d="M465 72H498"/><rect class="box" x="70" y="210" width="250" height="80" rx="10"/><text x="195" y="240" text-anchor="middle">Provisional / disconnected</text><text class="sub" x="195" y="265" text-anchor="middle">Readable snapshot, no mutations</text><rect class="box" x="395" y="210" width="250" height="80" rx="10"/><text x="520" y="240" text-anchor="middle">Switch acknowledgement</text><text class="sub" x="520" y="265" text-anchor="middle">Wait for replacement owner</text><path class="line" marker-end="url(#arrow)" d="M330 145L220 203"/><path class="line" marker-end="url(#arrow)" d="M395 145L495 203"/></svg>
