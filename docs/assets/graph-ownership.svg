<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard graph ownership</title>
  <desc id="desc">Daemon status is authoritative. GraphStore admits matching reads and scoped mutations, keeps preview separate and retains read-only snapshots during reconnect or switching.</desc>
  <style>text{font:16px system-ui,sans-serif;fill:#172554;text-anchor:middle}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.sub{font-size:14px}.line{fill:none;stroke:#2563eb;stroke-width:2}</style>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#2563eb"/></marker></defs>
  <rect width="360" height="650" rx="12" fill="#fff"/>
  <g class="box"><rect x="24" y="20" width="312" height="78" rx="10"/><rect x="24" y="130" width="312" height="130" rx="10"/><rect x="24" y="292" width="312" height="78" rx="10"/><rect x="24" y="410" width="312" height="86" rx="10"/><rect x="24" y="528" width="312" height="102" rx="10"/></g>
  <text x="180" y="50">DaemonStore</text><text class="sub" x="180" y="76">Authoritative SSE context + resources</text>
  <text x="180" y="159">GraphStore</text><text class="sub" x="180" y="185">One publication boundary</text><text class="sub" x="180" y="211">Matching reads + scoped edge intents</text><text class="sub" x="180" y="237">Separate preview + switch intent</text>
  <text x="180" y="322">Canvas + drawer</text><text class="sub" x="180" y="348">Matching live graph</text>
  <text x="180" y="442">Provisional / disconnected</text><text class="sub" x="180" y="470">Readable snapshot, no mutations</text>
  <text x="180" y="558">Switch acknowledgement</text><text class="sub" x="180" y="584">Not proof of runtime ownership</text><text class="sub" x="180" y="610">Wait for replacement owner + graph</text>
  <g class="line" marker-end="url(#arrow)"><path d="M180 98V126"/><path d="M180 260V288"/></g>
  <path class="line" stroke-dasharray="5 4" d="M24 195H12V579H24M12 453H24"/>
  <text class="sub" x="180" y="395">GraphStore read-only safeguards</text>
</svg>
