<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
<title id="title">Selected logs in one terminal</title>
<desc id="desc">Web and API log streams feed one terminal writer. Every output line keeps its resource name.</desc>
<rect width="320" height="240" rx="16" fill="#f4f7fb"/>
<g font-family="system-ui,sans-serif" font-size="15" fill="#172b4d" text-anchor="middle">
<rect x="20" y="20" width="125" height="48" rx="10" fill="#e1ecff" stroke="#55749d"/>
<text x="82" y="50">web</text>
<rect x="175" y="20" width="125" height="48" rx="10" fill="#e1ecff" stroke="#55749d"/>
<text x="237" y="50">api</text>
<path d="M82 68v25h78m77-25v25h-77v25" fill="none" stroke="#55749d" stroke-width="2"/>
<path d="m155 110 5 8 5-8" fill="none" stroke="#55749d" stroke-width="2"/>
<rect x="20" y="120" width="280" height="100" rx="10" fill="#172b4d"/>
<g fill="#f4f7fb" text-anchor="start" font-family="ui-monospace,monospace" font-size="14">
<text x="36" y="148">[web] request /orders</text>
<text x="36" y="176">[api] saved order</text>
<text x="36" y="204">[web] response 200</text>
</g></g></svg>
