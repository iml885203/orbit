<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="title desc"><title id="title">預覽後再套用</title><desc id="desc">預覽不改變執行環境。真正套用時重新讀取與計算。</desc><style>text{font:15px system-ui,sans-serif;fill:#172f4b}rect{fill:#eff6ff;stroke:#567da6}path{fill:none;stroke:#567da6;stroke-width:2}@media(prefers-color-scheme:dark){text{fill:#eef5ff}rect{fill:#18314b;stroke:#90b4da}path{stroke:#90b4da}}</style><rect x="20" y="12" width="320" height="64" rx="10"/><text x="180" y="49" text-anchor="middle">讀取最新設定</text><path d="M180 80v24m-5-5 5 5 5-5"/><rect x="20" y="112" width="320" height="64" rx="10"/><text x="180" y="149" text-anchor="middle">預覽受影響資源</text><path d="M180 180v24m-5-5 5 5 5-5"/><rect x="20" y="212" width="320" height="64" rx="10"/><text x="180" y="249" text-anchor="middle">套用時重新計算</text></svg>
