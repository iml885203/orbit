name: Feature request
description: Propose a user outcome that would make local development simpler
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Orbit optimizes for a small mental model. State the gap between today and the desired state, and draw the boundary of what you are asking for — before proposing configuration or commands.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The gap this closes — what happens today (including the workaround you use), and what should happen instead. Who encounters it?
      placeholder: |
        Today: … (workaround: …)
        Expected: …
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this request covers. List the cases the feature must handle.
    validations:
      required: true
  - type: textarea
    id: not-in-scope
    attributes:
      label: Not in scope
      description: What this request deliberately excludes, so the boundary is explicit and the feature stays small.
    validations:
      required: true
  - type: textarea
    id: key-example
    attributes:
      label: Key example
      description: One concrete example of the feature in use — the simplest successful workflow (command, config, or user steps) as it would look once this exists.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples or related tools — without including private project information.
