name: Sync package repository
description: Dispatch and wait for an Orbit package metadata update
inputs:
  repository:
    description: Package repository to update
    required: true
  token:
    description: Token allowed to dispatch and inspect the package repository
    required: true
  version:
    description: Exact Orbit release tag
    required: true
  existing_run_id:
    description: Accepted updater run to verify without dispatching another update
    required: false
    default: ""
  result_path:
    description: Optional bounded observation result and explicit local checkpoint path
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION: ${{ inputs.version }}
        SYNC_RESULT_PATH: ${{ inputs.result_path }}
        EXISTING_RUN_ID: ${{ inputs.existing_run_id }}
      run: "$GITHUB_ACTION_PATH/sync.sh"
