name: Sync package repository
description: Dispatch and wait for an Orbit package metadata update
inputs:
  repository:
    description: Package repository to update
    required: true
  token:
    description: Token allowed to dispatch and inspect the package repository
    required: true
  version:
    description: Exact Orbit release tag
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        previous_run_id=$(gh run list --repo "$REPOSITORY" --workflow update.yml \
          --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
        gh workflow run update.yml --repo "$REPOSITORY" --ref main \
          -f project=orbit -f version="$VERSION"
        for _ in $(seq 1 20); do
          run_id=$(gh run list --repo "$REPOSITORY" --workflow update.yml \
            --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$run_id" ] && [ "$run_id" != "$previous_run_id" ] && break
          run_id=
          sleep 3
        done
        [ -n "${run_id:-}" ] || { echo "$REPOSITORY updater did not start" >&2; exit 1; }
        gh run watch "$run_id" --repo "$REPOSITORY" --exit-status
