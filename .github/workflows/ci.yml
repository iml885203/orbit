name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      ORBIT_PRIVATE_IDENTIFIERS_PATTERN: ${{ secrets.ORBIT_PRIVATE_IDENTIFIERS_PATTERN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Verify private identifier gate on main
        if: ${{ github.event_name == 'push' }}
        run: test -n "$ORBIT_PRIVATE_IDENTIFIERS_PATTERN"
      - run: make preflight

  first-five-minutes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build installed-user binary
        run: |
          pnpm --dir ui install --frozen-lockfile
          make build
      - name: Run README journey from an empty directory
        run: ./scripts/test-first-five-minutes.sh
      - name: Run local-first adoption from an empty project
        run: ./scripts/test-local-first-adoption.sh
