name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - run: make preflight

  # A 1.0 release gate: dependency vulnerabilities must be caught before a tag,
  # not discovered by a user. Scoped to called symbols so an unreachable CVE in a
  # transitive module does not block a release it cannot affect. NOTICE lives
  # here too — both answer "what did we ship and under what terms".
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Scan Go dependencies
        run: make vulncheck
      - name: Scan dashboard runtime dependencies
        run: pnpm --dir ui audit --prod
      - name: Scan documentation website dependencies
        run: pnpm --dir website audit
      - name: Verify third-party notices match shipped dependencies
        run: make test-notice

  installed-user-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Run installed-user journeys with one build
        run: make test-journeys
      - name: Upload installed-user journey diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installed-user-journey-diagnostics-${{ github.run_attempt }}
          path: artifacts/installed-user-journeys
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
