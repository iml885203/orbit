name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.impact.outputs.required }}
      profile: ${{ steps.impact.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify source impact conservatively
        id: impact
        env:
          IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$IMPACT_BASE" ] && [ "$IMPACT_BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/native_impact.py --base "$IMPACT_BASE" --github-output "$GITHUB_OUTPUT" --record "$RUNNER_TEMP/native-plan.json"
          else
            python3 scripts/native_impact.py --github-output "$GITHUB_OUTPUT" --record "$RUNNER_TEMP/native-plan.json"
          fi

      - name: Publish native coverage plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orbit-native-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/native-plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  candidate:
    needs: native-impact
    if: needs.native-impact.outputs.required == 'true'
    uses: ./.github/workflows/candidate.yml
    with:
      version: v0.0.0-platform-smoke

  native:
    needs: [native-impact, candidate]
    if: needs.native-impact.outputs.required == 'true'
    uses: ./.github/workflows/platform-smoke.yml
    with:
      profile: ${{ needs.native-impact.outputs.profile }}
      version: v0.0.0-platform-smoke
      artifact-id: ${{ needs.candidate.outputs.artifact-id }}
      archive-digest: ${{ needs.candidate.outputs.archive-digest }}
      manifest-sha256: ${{ needs.candidate.outputs.manifest-sha256 }}
      producer-attempt: ${{ needs.candidate.outputs.producer-attempt }}
      workflow-ref: ${{ needs.candidate.outputs.workflow-ref }}

  native-gate:
    needs: [native-impact, candidate, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the selected coverage or explicit documentation no-op
        env:
          IMPACT_RESULT: ${{ needs.native-impact.result }}
          NATIVE_PROFILE: ${{ needs.native-impact.outputs.profile }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          set -euo pipefail
          test "$IMPACT_RESULT" = success
          case "$NATIVE_PROFILE" in
            linux|full) test "$CANDIDATE_RESULT" = success; test "$NATIVE_RESULT" = success ;;
            none) test "$CANDIDATE_RESULT" = skipped; test "$NATIVE_RESULT" = skipped ;;
            *) echo 'Missing or unknown native coverage profile' >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ needs.native-impact.outputs.profile != 'none' }}
        with:
          name: orbit-candidate-identity-${{ github.run_id }}-${{ needs.candidate.outputs.producer-attempt }}
          path: ${{ runner.temp }}/native-gate-identity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ needs.native-impact.outputs.profile != 'none' }}
        with:
          pattern: native-evidence-${{ needs.candidate.outputs.artifact-id }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-gate-receipts
      - name: Verify exact selected-target receipts
        if: ${{ needs.native-impact.outputs.profile != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_PROFILE: ${{ needs.native-impact.outputs.profile }}
          PRODUCER_ATTEMPT: ${{ needs.candidate.outputs.producer-attempt }}
          WORKFLOW_REF: ${{ needs.candidate.outputs.workflow-ref }}
          ARTIFACT_ID: ${{ needs.candidate.outputs.artifact-id }}
          ARCHIVE_DIGEST: ${{ needs.candidate.outputs.archive-digest }}
          MANIFEST_SHA: ${{ needs.candidate.outputs.manifest-sha256 }}
        run: >-
          python3 scripts/native_checks.py verify --profile "$NATIVE_PROFILE"
          --identity "$RUNNER_TEMP/native-gate-identity/candidate-identity.json"
          --receipts "$RUNNER_TEMP/native-gate-receipts" --version v0.0.0-platform-smoke
          --producer-attempt "$PRODUCER_ATTEMPT" --workflow-ref "$WORKFLOW_REF"
          --artifact-id "$ARTIFACT_ID" --archive-digest "$ARCHIVE_DIGEST" --manifest-sha256 "$MANIFEST_SHA"

  go-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/workflowlint/go.sum
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Reject new debt and require legacy reductions
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$LINT_BASE" ] && [ "$LINT_BASE" != "0000000000000000000000000000000000000000" ]; then
            make lint-new LINT_BASE_REF="$LINT_BASE"
          else
            make lint-new
          fi
  preflight:
    # Playwright 1.55 (website) ships no chromium for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/workflowlint/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - run: make preflight

  # A 1.0 release gate: dependency vulnerabilities must be caught before a tag,
  # not discovered by a user. Scoped to called symbols so an unreachable CVE in a
  # transitive module does not block a release it cannot affect. NOTICE lives
  # here too — both answer "what did we ship and under what terms".
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Scan Go dependencies
        run: make vulncheck
      - name: Scan dashboard runtime dependencies
        run: pnpm --dir ui audit --prod
      - name: Scan documentation website dependencies
        run: pnpm --dir website audit
      - name: Verify third-party notices match shipped dependencies
        run: make test-notice

  installed-user-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Run installed-user journeys with one build
        run: make test-journeys
      - name: Upload installed-user journey diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installed-user-journey-diagnostics-${{ github.run_attempt }}
          path: artifacts/installed-user-journeys
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  dotnet-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Start a .NET service in build and watch modes
        env:
          ORBIT_E2E_REQUIRE_DOTNET: "1"
        run: make test-journey-dotnet
