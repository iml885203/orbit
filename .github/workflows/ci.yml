name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Reject new debt and require legacy reductions
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$LINT_BASE" ] && [ "$LINT_BASE" != "0000000000000000000000000000000000000000" ]; then
            make lint-new LINT_BASE_REF="$LINT_BASE"
          else
            make lint-new
          fi
  preflight:
    # Playwright 1.55 (website) ships no chromium for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - run: make preflight

  # A 1.0 release gate: dependency vulnerabilities must be caught before a tag,
  # not discovered by a user. Scoped to called symbols so an unreachable CVE in a
  # transitive module does not block a release it cannot affect. NOTICE lives
  # here too — both answer "what did we ship and under what terms".
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Scan Go dependencies
        run: make vulncheck
      - name: Scan dashboard runtime dependencies
        run: pnpm --dir ui audit --prod
      - name: Scan documentation website dependencies
        run: pnpm --dir website audit
      - name: Verify third-party notices match shipped dependencies
        run: make test-notice

  installed-user-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Run installed-user journeys with one build
        run: make test-journeys
      - name: Upload installed-user journey diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installed-user-journey-diagnostics-${{ github.run_attempt }}
          path: artifacts/installed-user-journeys
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  # A real .NET service in build and watch modes (#247). Non-blocking while it
  # proves stable on Linux runners: dotnet's first-use setup raced there when
  # two services started at once. Make it blocking once it stays green.
  dotnet-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install dashboard dependencies
        run: pnpm --dir ui install --frozen-lockfile
      - name: Start a .NET service in build and watch modes
        env:
          ORBIT_E2E_REQUIRE_DOTNET: "1"
        run: make test-journey-dotnet
