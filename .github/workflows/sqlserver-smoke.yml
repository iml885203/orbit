name: SQL Server smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  live-workflow:
    name: Publish, protect data, and reset
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORBIT_SQL_E2E_PASSWORD: Orbit-E2E-Only_2026!
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      # The dashboard is embedded with //go:embed all:dist, so cmd/orbit does
      # not compile without it — this smoke exercises only the CLI, but the
      # binary still cannot be built without the UI toolchain.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install sqlpackage
        run: dotnet tool install --global microsoft.sqlpackage
      - name: Build Orbit
        run: make build
      - name: Start cold SQL Server through Orbit readiness
        run: |
          set -euo pipefail
          mkdir -p .sqlserver-smoke
          cat > .sqlserver-smoke/orbit.yaml <<'YAML'
          version: "3"
          containers:
            database:
              image: mcr.microsoft.com/mssql/server:2022-latest
              ports:
                mssql: "11433:1433"
              environment:
                ACCEPT_EULA: "Y"
                MSSQL_SA_PASSWORD: "${ORBIT_SQL_E2E_PASSWORD}"
              health_check:
                type: exec
                command:
                  - /bin/sh
                  - -c
                  - password="$(printenv MSSQL_SA_PASSWORD)"; if [ -z "$password" ]; then exit 2; fi; export SQLCMDPASSWORD="$password"; exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -Q "SELECT 1"
                interval: 1s
                retries: 90
          sqlserver:
            target: database
            username: sa
            password_env: MSSQL_SA_PASSWORD
            projects:
              - path: Smoke.sqlproj
          YAML
          ./bin/orbit --config .sqlserver-smoke/orbit.yaml --instance sql-smoke up
      - name: Exercise the real SQL workflow
        env:
          ORBIT_E2E_SQL: localhost:11433:${{ env.ORBIT_SQL_E2E_PASSWORD }}
        run: go test ./internal/sqlpublish -run 'TestE2E_QuickDiff|TestBuildDacpac' -v -count=1
      - name: Remove isolated SQL Server
        if: always()
        run: ./bin/orbit instance clean sql-smoke --json || true
