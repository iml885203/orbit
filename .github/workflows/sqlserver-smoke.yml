name: SQL Server smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  live-workflow:
    # Names the layer it actually covers. The publish engine's own tests run
    # against a real SQL Server here; the CLI that resolves targets and
    # credentials before calling that engine has no coverage in this gate —
    # which is how a target-resolution bug reached v0.15.0 and survived to
    # v0.15.2. Renaming rather than widening because the gap is worth stating
    # before it is worth closing.
    #
    # docs/1.0-test-matrix.md describes this gate too. This comment is the
    # copy to trust: whoever changes what the gate runs passes through here,
    # and may never open that file.
    name: Publish engine against a real SQL Server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ORBIT_SQL_E2E_PASSWORD: Orbit-E2E-Only_2026!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      # The dashboard is embedded with //go:embed all:dist, so cmd/orbit does
      # not compile without it — this smoke exercises only the CLI, but the
      # binary still cannot be built without the UI toolchain.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install sqlpackage
        run: dotnet tool install --global microsoft.sqlpackage
      - name: Build Orbit
        run: make build
      - name: Start cold SQL Server through Orbit readiness
        run: |
          set -euo pipefail
          mkdir -p .sqlserver-smoke
          cat > .sqlserver-smoke/orbit.yaml <<'YAML'
          version: "3"
          containers:
            database:
              image: mcr.microsoft.com/mssql/server:2022-latest
              ports:
                mssql: "11433:1433"
              environment:
                ACCEPT_EULA: "Y"
                MSSQL_SA_PASSWORD: "${ORBIT_SQL_E2E_PASSWORD}"
              health_check:
                type: exec
                command:
                  - /bin/sh
                  - -c
                  - password="$(printenv MSSQL_SA_PASSWORD)"; if [ -z "$password" ]; then exit 2; fi; export SQLCMDPASSWORD="$password"; exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -I -Q "SELECT 1"
                interval: 1s
                retries: 90
          sqlserver:
            target: database
            username: sa
            password_env: MSSQL_SA_PASSWORD
            projects:
              - path: Smoke.sqlproj
          YAML
          ./bin/orbit --config .sqlserver-smoke/orbit.yaml --instance sql-smoke up
      - name: Run the publish engine's live tests
        env:
          ORBIT_E2E_SQL: localhost:11433:${{ env.ORBIT_SQL_E2E_PASSWORD }}
        run: go test ./internal/sqlpublish -run 'TestE2E_QuickDiff|TestBuildDacpac' -v -count=1
      - name: Remove isolated SQL Server
        if: always()
        run: ./bin/orbit instance clean sql-smoke --json || true
