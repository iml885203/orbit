name: Platform smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            windows: false
          - name: macOS amd64
            runner: macos-15-intel
            windows: false
          - name: Linux amd64
            runner: ubuntu-24.04
            windows: false
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            windows: false
          - name: Windows amd64 Beta
            runner: windows-2025
            windows: true
          - name: Windows arm64 Beta
            runner: windows-11-arm
            windows: true
    env:
      ORBIT_SMOKE_VERSION: v0.0.0-platform-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build dashboard
        run: pnpm --dir ui install --frozen-lockfile && pnpm --dir ui build
      - name: Run native tests
        run: go test ./...
      - name: Exercise install, downgrade, failure, rollback, and uninstall
        if: ${{ !matrix.windows }}
        shell: bash
        run: make test-install
      - name: Exercise native PowerShell installer lifecycle
        if: ${{ matrix.windows }}
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Build and smoke Unix binary
        if: ${{ !matrix.windows }}
        shell: bash
        run: |
          mkdir -p bin
          go build -ldflags "-s -w -X main.version=${ORBIT_SMOKE_VERSION}" -o bin/orbit ./cmd/orbit
          ORBIT_BIN="$PWD/bin/orbit" go test -tags=platformsmoke -run TestPlatformSmokeCleanUserJourney -v ./app
      - name: Build and smoke Windows binary
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -ldflags "-s -w -X main.version=$env:ORBIT_SMOKE_VERSION" -o bin/orbit.exe ./cmd/orbit
          $env:ORBIT_BIN = "$PWD\bin\orbit.exe"
          go test -tags=platformsmoke -run TestPlatformSmokeCleanUserJourney -v ./app
