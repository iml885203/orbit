name: Platform smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            windows: false
          - name: macOS amd64
            runner: macos-15-intel
            windows: false
          - name: Linux amd64
            runner: ubuntu-24.04
            windows: false
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            windows: false
          - name: Windows amd64 Beta
            runner: windows-2025
            windows: true
          - name: Windows arm64 Beta
            runner: windows-11-arm
            windows: true
    env:
      ORBIT_SMOKE_VERSION: v0.0.0-platform-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build dashboard
        run: pnpm --dir ui install --frozen-lockfile && pnpm --dir ui build
      - name: Compile the full native codebase
        run: go build ./...
      - name: Run OS-specific native tests
        run: go test ./app ./autoupdate ./platform
      - name: Exercise install, downgrade, failure, rollback, and uninstall
        if: ${{ !matrix.windows }}
        shell: bash
        run: make test-install
      - name: Exercise native PowerShell installer lifecycle
        if: ${{ matrix.windows }}
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Build and smoke Unix binary
        if: ${{ !matrix.windows }}
        shell: bash
        run: |
          mkdir -p bin
          go build -ldflags "-s -w -X main.version=${ORBIT_SMOKE_VERSION}" -o bin/orbit ./cmd/orbit
          ORBIT_BIN="$PWD/bin/orbit" go test -tags=platformsmoke -run TestPlatformSmokeCleanUserJourney -v ./app
      - name: Exercise native Unix uninstall command
        if: ${{ !matrix.windows }}
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/bin" "$test_root/home"
          touch "$test_root/home/preserved"
          cp bin/orbit "$test_root/bin/orbit"
          ORBIT_HOME="$test_root/home" "$test_root/bin/orbit" uninstall
          test -x "$test_root/bin/orbit"
          ORBIT_HOME="$test_root/home" "$test_root/bin/orbit" uninstall --yes
          test ! -e "$test_root/bin/orbit"
          test -e "$test_root/home/preserved"
          cp bin/orbit "$test_root/bin/orbit"
          ORBIT_HOME="$test_root/home" "$test_root/bin/orbit" uninstall --yes --purge
          test ! -e "$test_root/bin/orbit"
          test ! -e "$test_root/home"
      - name: Build and smoke Windows binary
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -ldflags "-s -w -X main.version=$env:ORBIT_SMOKE_VERSION" -o bin/orbit.exe ./cmd/orbit
          $env:ORBIT_BIN = "$PWD\bin\orbit.exe"
          go test -tags=platformsmoke -run TestPlatformSmokeCleanUserJourney -v ./app
      - name: Exercise native Windows uninstall command
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testRoot = Join-Path ([System.IO.Path]::GetTempPath()) "orbit-uninstall-$PID"
          $installDir = Join-Path $testRoot "bin"
          $orbitHome = Join-Path $testRoot "home"
          New-Item -ItemType Directory -Force $installDir, $orbitHome | Out-Null
          Set-Content -Path (Join-Path $orbitHome "preserved") -Value "yes"
          $target = Join-Path $installDir "orbit.exe"
          Copy-Item bin/orbit.exe $target
          $env:ORBIT_HOME = $orbitHome
          & $target uninstall
          if (-not (Test-Path $target)) { throw "preview removed the binary" }
          & $target uninstall --yes
          for ($attempt = 0; $attempt -lt 150 -and (Test-Path $target); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path $target) {
            Get-ChildItem $env:TEMP -Filter "orbit-uninstall-*.ps1.failed" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Cleanup helper failure: $($_.FullName)"
                Get-Content -LiteralPath $_.FullName
              }
            throw "binary was not removed"
          }
          if (-not (Test-Path (Join-Path $orbitHome "preserved"))) { throw "user data was not preserved" }
          Copy-Item bin/orbit.exe $target
          & $target uninstall --yes --purge
          for ($attempt = 0; $attempt -lt 150 -and ((Test-Path $target) -or (Test-Path $orbitHome)); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path $target) {
            Get-ChildItem $env:TEMP -Filter "orbit-uninstall-*.ps1.failed" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Cleanup helper failure: $($_.FullName)"
                Get-Content -LiteralPath $_.FullName
              }
            throw "binary was not removed during purge"
          }
          if (Test-Path $orbitHome) { throw "user data was not purged" }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $testRoot
