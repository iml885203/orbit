name: Platform smoke

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Native diagnostic coverage (release always uses full)
        type: choice
        options: [full, linux]
        default: full
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      version:
        type: string
        default: v0.0.0-platform-smoke
      artifact-id:
        type: string
        default: ''
      archive-digest:
        type: string
        default: ''
      manifest-sha256:
        type: string
        default: ''
      producer-attempt:
        type: string
        default: ''
      workflow-ref:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select the explicit native profile
        id: select
        env:
          NATIVE_PROFILE: ${{ inputs.profile || 'full' }}
        run: python3 scripts/native_checks.py matrix --profile "$NATIVE_PROFILE" --github-output "$GITHUB_OUTPUT"

  produce:
    needs: select
    if: ${{ !inputs.artifact-id }}
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ inputs.version || 'v0.0.0-platform-smoke' }}

  native:
    needs: [produce, select]
    if: ${{ !cancelled() && needs.select.result == 'success' && (inputs.artifact-id != '' || needs.produce.result == 'success') }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      ORBIT_SMOKE_VERSION: ${{ inputs.version || 'v0.0.0-platform-smoke' }}
      CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact-id || needs.produce.outputs.artifact-id }}
      CANDIDATE_ARCHIVE_DIGEST: ${{ inputs.archive-digest || needs.produce.outputs.archive-digest }}
      CANDIDATE_MANIFEST_SHA: ${{ inputs.manifest-sha256 || needs.produce.outputs.manifest-sha256 }}
      CANDIDATE_PRODUCER_ATTEMPT: ${{ inputs.producer-attempt || needs.produce.outputs.producer-attempt }}
      CANDIDATE_WORKFLOW_REF: ${{ inputs.workflow-ref || needs.produce.outputs.workflow-ref }}
      CANDIDATE_TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      ORBIT_UPDATE_BACKGROUND: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ env.CANDIDATE_ARTIFACT_ID }}
          path: ${{ runner.temp }}/candidate
      - name: Isolate candidate runtime state
        shell: bash
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'orbit-candidate-home'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ORBIT_HOME=' + str(root) + '\nORBIT_UPDATE_HOME=' + str(root / 'updates') + '\n')
              for name in ('TMPDIR', 'TMP', 'TEMP', 'GOTMPDIR', 'ORBIT_TEST_SOCKET_ROOT'):
                  output.write(name + '=' + os.environ['RUNNER_TEMP'] + '\n')
          PYCODE
      - name: Verify and install exact candidate bytes
        shell: bash
        run: >-
          python scripts/candidate.py consume
          --directory "$RUNNER_TEMP/candidate" --version "$ORBIT_SMOKE_VERSION"
          --producer-attempt "$CANDIDATE_PRODUCER_ATTEMPT" --workflow-ref "$CANDIDATE_WORKFLOW_REF"
          --artifact-id "$CANDIDATE_ARTIFACT_ID" --archive-digest "$CANDIDATE_ARCHIVE_DIGEST"
          --manifest-sha256 "$CANDIDATE_MANIFEST_SHA" --target "$CANDIDATE_TARGET"
      - name: Compile the full native codebase
        run: go build ./...
      - name: Run OS-specific native tests
        run: go test ./internal/app ./internal/autoupdate ./internal/platform
      - name: Exercise install, downgrade, failure, rollback, and uninstall
        if: ${{ !matrix.windows }}
        shell: bash
        run: make test-install
      - name: Exercise native PowerShell installer lifecycle
        if: ${{ matrix.windows }}
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Smoke the verified Unix candidate
        if: ${{ !matrix.windows }}
        shell: bash
        run: |
          ORBIT_BIN="$PWD/bin/orbit" go test -tags=platformsmoke -run 'TestPlatformSmoke(CleanUserJourney|AutomaticUpdateWorker)' -v ./internal/app
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: ${{ !matrix.windows }}
        with:
          dotnet-version: 8.0.x
      - name: Start a .NET service in build and watch modes
        if: ${{ !matrix.windows }}
        shell: bash
        env:
          ORBIT_E2E_REQUIRE_DOTNET: "1"
        run: ORBIT_BIN="$PWD/bin/orbit" go test -tags=e2e -count=1 -run '^TestE2E_DotnetServiceStartsInBuildAndWatchModes$' -v ./internal/app
      - name: Exercise native Unix uninstall command
        if: ${{ !matrix.windows }}
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/bin" "$test_root/home"
          touch "$test_root/home/preserved"
          cp bin/orbit "$test_root/bin/orbit"
          ORBIT_HOME="$test_root/home" "$test_root/bin/orbit" uninstall
          test -x "$test_root/bin/orbit"
          ORBIT_HOME="$test_root/home" "$test_root/bin/orbit" uninstall --yes
          test ! -e "$test_root/bin/orbit"
          test -e "$test_root/home/preserved"
          cp bin/orbit "$test_root/bin/orbit"
          ORBIT_HOME="$test_root/home" "$test_root/bin/orbit" uninstall --yes --purge
          test ! -e "$test_root/bin/orbit"
          test ! -e "$test_root/home"
      - name: Smoke the verified Windows candidate
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          $env:ORBIT_BIN = "$PWD\bin\orbit.exe"
          go test -tags=platformsmoke -run 'TestPlatformSmoke(CleanUserJourney|AutomaticUpdateWorker)' -v ./internal/app
      - name: Exercise native Windows uninstall command
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testRoot = Join-Path ([System.IO.Path]::GetTempPath()) "orbit-uninstall-$PID"
          $installDir = Join-Path $testRoot "bin"
          $orbitHome = Join-Path $testRoot "home"
          New-Item -ItemType Directory -Force $installDir, $orbitHome | Out-Null
          Set-Content -Path (Join-Path $orbitHome "preserved") -Value "yes"
          $target = Join-Path $installDir "orbit.exe"
          Copy-Item bin/orbit.exe $target
          $env:ORBIT_HOME = $orbitHome
          & $target uninstall
          if (-not (Test-Path $target)) { throw "preview removed the binary" }
          & $target uninstall --yes
          for ($attempt = 0; $attempt -lt 150 -and (Test-Path $target); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path $target) {
            Get-ChildItem $env:TEMP -Filter "orbit-uninstall-*.ps1.failed" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Cleanup helper failure: $($_.FullName)"
                Get-Content -LiteralPath $_.FullName
              }
            throw "binary was not removed"
          }
          if (-not (Test-Path (Join-Path $orbitHome "preserved"))) { throw "user data was not preserved" }
          Copy-Item bin/orbit.exe $target
          & $target uninstall --yes --purge
          for ($attempt = 0; $attempt -lt 150 -and ((Test-Path $target) -or (Test-Path $orbitHome)); $attempt++) {
            Start-Sleep -Milliseconds 100
          }
          if (Test-Path $target) {
            Get-ChildItem $env:TEMP -Filter "orbit-uninstall-*.ps1.failed" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Cleanup helper failure: $($_.FullName)"
                Get-Content -LiteralPath $_.FullName
              }
            throw "binary was not removed during purge"
          }
          if (Test-Path $orbitHome) { throw "user data was not purged" }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $testRoot
      - name: Bind successful native scenarios to the tested bytes
        shell: bash
        run: >-
          python scripts/candidate.py receipt
          --directory "$RUNNER_TEMP/candidate" --version "$ORBIT_SMOKE_VERSION"
          --producer-attempt "$CANDIDATE_PRODUCER_ATTEMPT" --workflow-ref "$CANDIDATE_WORKFLOW_REF"
          --artifact-id "$CANDIDATE_ARTIFACT_ID" --archive-digest "$CANDIDATE_ARCHIVE_DIGEST"
          --manifest-sha256 "$CANDIDATE_MANIFEST_SHA" --target "$CANDIDATE_TARGET"
          --receipts "$RUNNER_TEMP/native-receipts"
      - name: Upload native receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-evidence-${{ env.CANDIDATE_ARTIFACT_ID }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-receipts
          overwrite: true
          if-no-files-found: error
          retention-days: 30
