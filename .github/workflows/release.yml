name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create at the current main commit
        required: true
        type: string
      confirmation:
        description: Type RELEASE followed by the tag, for example RELEASE v1.0.0
        required: true
        type: string
      notes:
        description: User-facing release notes
        required: true
        type: string

permissions:
  checks: read
  contents: read

jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify explicit release approval
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CONFIRMATION" != "RELEASE $RELEASE_VERSION" ]; then
            echo "confirmation must be exactly: RELEASE $RELEASE_VERSION" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag is not a semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi
          for section in "## What changed" "## Why it matters"; do
            if ! grep -Fqx "$section" <<<"$RELEASE_NOTES"; then
              echo "release notes are missing: $section" >&2
              exit 1
            fi
          done
          ./scripts/verify-release-candidate.sh "$RELEASE_VERSION"
          if git rev-parse --verify "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "$RELEASE_VERSION already exists; release tags are immutable" >&2
            exit 1
          fi
          git fetch origin main
          candidate_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse origin/main)"
          if [ "$candidate_commit" != "$main_commit" ]; then
            echo "workflow commit $candidate_commit is not current main $main_commit" >&2
            exit 1
          fi
      - name: Verify main CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_commit="$(git rev-parse origin/main)"
          successful_gates="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$main_commit/check-runs" \
              --jq '[.check_runs[]
                | select(
                    (.name == "preflight" or .name == "installed-user-journeys")
                    and .conclusion == "success"
                  )
                | .name]
                | unique
                | length'
          )"
          if [ "$successful_gates" != "2" ]; then
            echo "main must pass CI preflight and installed-user-journeys before release" >&2
            exit 1
          fi
      - name: Verify pinned demo evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The demo has its own calendar versioning (vYEAR.MONTH.N) and is not
          # re-tagged per Orbit release. What must hold is that the ref this
          # binary pins exists and passed the demo's own journey — checked
          # against whatever EnvRepoRef points at, not this release's tag.
          demo_repository="iml885203/orbit-demo"
          demo_ref="$(sed -n 's/.*EnvRepoRef: "\([^"]*\)".*/\1/p' cmd/orbit/extensions.go)"
          if [ -z "$demo_ref" ]; then
            echo "cmd/orbit/extensions.go has no EnvRepoRef to verify" >&2
            exit 1
          fi
          ref_object="$(gh api "repos/$demo_repository/git/ref/tags/$demo_ref")"
          demo_commit="$(jq -r '.object.sha' <<<"$ref_object")"
          if [ "$(jq -r '.object.type' <<<"$ref_object")" = "tag" ]; then
            demo_commit="$(
              gh api "repos/$demo_repository/git/tags/$demo_commit" --jq '.object.sha'
            )"
          fi
          successful_demo_gate="$(
            gh api "repos/$demo_repository/commits/$demo_commit/check-runs" \
              --jq '[.check_runs[]
                | select(.name == "validate" and .conclusion == "success")]
                | length'
          )"
          if [ "$successful_demo_gate" = "0" ]; then
            echo "$demo_repository@$demo_ref must pass its validate journey before Orbit pins it" >&2
            exit 1
          fi

  platform-smoke:
    needs: approval
    uses: ./.github/workflows/platform-smoke.yml

  sqlserver-smoke:
    needs: approval
    uses: ./.github/workflows/sqlserver-smoke.yml

  release:
    needs: [approval, platform-smoke, sqlserver-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Verify candidate metadata
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
        run: ./scripts/verify-release-candidate.sh "$RELEASE_VERSION"
      - name: Build embedded dashboard
        run: pnpm --dir ui run build
      - name: Build release assets
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            output="dist/orbit-${goos}-${goarch}"
            if [ "$goos" = windows ]; then output="${output}.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -ldflags "-s -w -X main.version=${RELEASE_VERSION} -X main.buildTime=${build_time}" \
              -o "$output" ./cmd/orbit
            go version -m "$output" | grep -F "vcs.revision=$GITHUB_SHA"
          done
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/orbit.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create and verify checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum orbit-* > checksums.txt)
          (cd dist && sha256sum --check checksums.txt)
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest release SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: dist/orbit.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          git fetch origin main --tags
          main_commit="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_commit" ]; then
            echo "main moved from candidate $GITHUB_SHA to $main_commit during release" >&2
            exit 1
          fi
          release_title="Orbit $RELEASE_VERSION"
          if [[ "$RELEASE_VERSION" =~ ^v0\. ]]; then
            release_title="$release_title (Preview)"
          fi
          gh release create "$RELEASE_VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES" \
            --title "$release_title"

  update-homebrew:
    needs: release
    uses: ./.github/workflows/sync-homebrew.yml
    with:
      version: ${{ inputs.tag }}
    secrets:
      PACKAGE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_SYNC_APP_PRIVATE_KEY }}

  update-scoop:
    needs: release
    uses: ./.github/workflows/sync-scoop.yml
    with:
      version: ${{ inputs.tag }}
    secrets:
      PACKAGE_SYNC_APP_PRIVATE_KEY: ${{ secrets.PACKAGE_SYNC_APP_PRIVATE_KEY }}
