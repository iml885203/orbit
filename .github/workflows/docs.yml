name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'Makefile'
      - 'index.md'
      - 'zh-TW/**'
      - 'docs/**'
      - 'plugins/orbit/skills/orbit/**'
      - 'ui/public/**'
      - 'website/**'
      - 'scripts/test-docs-site-setup.sh'
      - 'README.md'
      - 'README.zh-TW.md'
      - 'CONTRIBUTING.md'
      - 'DESIGN.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
  # The homepage names the newest release, so a finished release republishes
  # the site. A workflow_run fires on main, which the Pages environment allows;
  # the release event itself would run on the tag ref and be refused.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Playwright 1.55 ships no chromium for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The homepage names the newest release tag; a tagless checkout
          # would silently drop that line.
          fetch-tags: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - uses: actions/configure-pages@v6
      - run: make docs-site-linux-deps docs-site-check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist
          include-hidden-files: true

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
