version: "3"

settings:
  shutdown_timeout: 10s
  health_check_interval: 3s
  docker_poll_interval: 2s

containers:
  redis:
    image: redis:7.4-alpine
    ports:
      redis:
        preferred: 26379
        target: 6379
    health_check:
      type: tcp

services:
  app:
    type: python
    kind: frontend
    path: .
    command: python3 -m http.server "$PORT"
    ports:
      http:
        preferred: 28080
    health_check:
      type: http
      path: /
    depends_on: [redis]
