version: "2"

linters:
  default: standard
  enable:
    # Existing
    - gocritic
    - misspell
    - prealloc

    # Convention enforcers added per docs/CODE_CONVENTIONS.md
    - errorlint        # §9: %w wrapping, no string-match on err.Error()
    - iface            # §6/§11: catches thin single-method interfaces
    - interfacebloat   # §6: flags interfaces with too many methods
    - revive           # carries modifies-parameter (immutability)
    - bodyclose        # http.Response.Body leaks
    - sqlclosecheck    # sql.Rows / sql.Stmt leaks
    - godox            # surfaces bare TODO/FIXME/HACK
    - funlen           # global coding-style: function size budget
    - gocognit         # complexity budget
    - nestif           # nesting depth budget

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam

    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true

    iface:
      enable:
        - unused      # interface declared but never satisfied externally
        - identical   # two interfaces with the same method set
        - opaque      # function returns an interface that always wraps one concrete type

    revive:
      rules:
        - name: modifies-parameter

    # Thresholds are set to current ceiling so this gates *regressions*, not
    # the existing baseline. Ratchet down as code is refactored. The aspirational
    # targets (from .claude/rules/coding-style.md) are funlen lines:50, gocognit:15,
    # nestif:4 — get there incrementally.
    funlen:
      lines: 120
      statements: 100
      ignore-comments: true
    gocognit:
      min-complexity: 100
    nestif:
      min-complexity: 30

    # noctx and contextcheck are intentionally NOT enabled yet — the codebase
    # has ~30 net.Listen / http.Get / NewRequest sites that need conversion to
    # context-aware variants. Enable in a follow-up PR after that sweep.

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - funlen      # tests routinely have long table-driven setup
          - gocognit
          - nestif

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

run:
  timeout: 5m
